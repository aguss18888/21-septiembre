<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌼 Feliz 21 de Septiembre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#bfe6ff;
    --sky-bottom:#fff3c4;
    --trunk:#7a5230;
    --trunk-dark:#5c3c22;
    --petal:#ffd54f;
    --petal-dark:#ffb300;
    --center:#ff8f00;
    --ground:#8bc34a;
    --ground-dark:#689f38;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 75%,#ffe9a8 100%);
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    color:#4a3a1a;
  }
  .sun{
    position:absolute;
    top:6%;
    right:10%;
    width:90px;
    height:90px;
    border-radius:50%;
    background:radial-gradient(circle,#fff6cf 0%,#ffe082 55%,rgba(255,224,130,0) 75%);
    box-shadow:0 0 60px 20px rgba(255,224,130,.5);
    animation:pulse 4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
  }
  .cloud{
    position:absolute;
    background:#fff;
    opacity:.85;
    border-radius:50px;
    filter:blur(.5px);
  }
  .cloud::before,.cloud::after{
    content:"";
    position:absolute;
    background:#fff;
    border-radius:50%;
  }
  .cloud1{ width:70px; height:24px; top:14%; left:8%; }
  .cloud1::before{ width:38px; height:38px; top:-18px; left:8px; }
  .cloud1::after{ width:28px; height:28px; top:-12px; left:38px; }
  .cloud2{ width:50px; height:18px; top:22%; right:22%; opacity:.7; }
  .cloud2::before{ width:26px; height:26px; top:-12px; left:6px; }
  .cloud2::after{ width:20px; height:20px; top:-8px; left:26px; }

  main{
    position:relative;
    z-index:1;
    width:100%;
    max-width:520px;
    padding:32px 16px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .stage{
    position:relative;
    width:min(88vw,360px);
    aspect-ratio:3/4;
    margin:0 auto;
  }

  .trunk-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  .trunk-path, .branch-path{
    fill:none;
    stroke:var(--trunk);
    stroke-linecap:round;
    stroke-width:3.2;
    stroke-dasharray:120;
    stroke-dashoffset:120;
    opacity:0;
  }
  .stage.grow .trunk-path{
    animation:draw 1s ease-out forwards;
  }
  .stage.grow .branch-path{
    animation:draw .8s ease-out forwards;
    animation-delay:.4s;
  }
  @keyframes draw{
    0%{opacity:1; stroke-dashoffset:120;}
    100%{opacity:1; stroke-dashoffset:0;}
  }

  .ground{
    position:absolute;
    left:-8%;
    right:-8%;
    bottom:0;
    height:8%;
    background:radial-gradient(ellipse at center, var(--ground) 0%, var(--ground-dark) 100%);
    border-radius:50%;
    opacity:.9;
  }

  .canopy{
    position:absolute;
    left:2%;
    right:2%;
    top:0;
    height:64%;
  }

  .flower{
    position:absolute;
    width:22px;
    height:22px;
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    animation:bloom .65s cubic-bezier(.34,1.56,.64,1) forwards;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.15));
    cursor:pointer;
    transition:transform .2s ease;
  }
  .flower:hover{
    transform:translate(-50%,-50%) scale(1.25) !important;
  }
  @keyframes bloom{
    0%{opacity:0; transform:translate(-50%,-50%) scale(0) rotate(-40deg);}
    65%{opacity:1; transform:translate(-50%,-50%) scale(1.18) rotate(10deg);}
    100%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg);}
  }
  .canopy.sway{
    animation:sway 5s ease-in-out infinite;
    transform-origin:50% 100%;
  }
  @keyframes sway{
    0%,100%{transform:rotate(-1.2deg);}
    50%{transform:rotate(1.2deg);}
  }

  .falling-petal{
    position:absolute;
    width:14px;
    height:14px;
    top:-20px;
    opacity:.9;
    pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg); opacity:.95;}
    100%{transform:translateY(420px) rotate(340deg); opacity:0;}
  }

  .message{
    text-align:center;
    margin-top:18px;
    opacity:0;
    transform:translateY(18px);
    transition:opacity 1s ease, transform 1s ease;
  }
  .message.show{
    opacity:1;
    transform:translateY(0);
  }
  .message h1{
    font-family:'Pacifico',cursive;
    font-weight:400;
    font-size:clamp(1.7rem,6vw,2.4rem);
    color:#c77b00;
    margin:0 0 8px;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .message p{
    font-size:clamp(.95rem,3vw,1.05rem);
    line-height:1.5;
    margin:4px 0;
    max-width:420px;
  }
  .divider{
    margin:10px auto;
    font-size:1.1rem;
    letter-spacing:6px;
    color:var(--petal-dark);
  }

  button#replay{
    margin-top:22px;
    padding:10px 22px;
    border:none;
    border-radius:999px;
    background:linear-gradient(135deg,#ffd54f,#ffb300);
    color:#5c3c00;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:.95rem;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(255,179,0,.45);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button#replay:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(255,179,0,.55);
  }
  button#replay:active{
    transform:translateY(0);
  }
</style>
</head>
<body>

<div class="sun"></div>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<main>
  <div class="stage" id="stage">
    <svg class="trunk-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path class="trunk-path" d="M 50 97 C 46 86, 54 74, 50 61" pathLength="120"/>
      <path class="branch-path" d="M 50 82 C 42 78, 34 72, 30 63" pathLength="120"/>
      <path class="branch-path" d="M 50 78 C 58 74, 66 68, 70 60" pathLength="120"/>
    </svg>
    <div class="ground"></div>
    <div class="canopy" id="canopy"></div>
  </div>

  <div class="message" id="message">
    <h1>¡Feliz 21 de Septiembre!</h1>
    <div class="divider">🌼 🌼 🌼</div>
    <p>Feliz Día de la Primavera y de las y los Estudiantes.</p>
    <p>Que esta nueva estación llene tu camino de flores, sol<br>y muchos comienzos bonitos. ¡Te mando un abrazo enorme!</p>
  </div>

  <button id="replay">🌸 Ver de nuevo</button>
</main>

<script>
(function(){
  const stage = document.getElementById('stage');
  const canopy = document.getElementById('canopy');
  const message = document.getElementById('message');

  const FLOWER_COUNT = 170;
  const TRUNK_TIME = 900;

  function flowerSVG(hue){
    return `
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <g>
          ${[0,72,144,216,288].map(a => `
            <ellipse cx="12" cy="6" rx="4" ry="6.2"
              fill="${hue}" stroke="#f9a825" stroke-width="0.4"
              transform="rotate(${a} 12 12)"/>
          `).join('')}
          <circle cx="12" cy="12" r="3.1" fill="#ff8f00"/>
        </g>
      </svg>`;
  }

  // Punto en el interior de un corazon (curva parametrica clasica)
  function heartPoint(t, r){
    const x = r * 16 * Math.pow(Math.sin(t), 3);
    const y = r * (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    return {x, y};
  }

  function buildHeartPoints(n){
    const pts = [];
    for(let i=0; i<n; i++){
      const t = Math.random() * Math.PI * 2;
      const r = Math.pow(Math.random(), 0.45); // mas densidad hacia el borde
      pts.push(heartPoint(t, r));
    }
    return pts;
  }

  function clearCanopy(){
    canopy.innerHTML = '';
    canopy.classList.remove('sway');
  }

  function plantFlowers(){
    const pts = buildHeartPoints(FLOWER_COUNT);
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    pts.forEach(p=>{
      if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
      if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
    });

    const hues = ['#ffd54f','#ffca28','#ffe082'];

    pts.forEach((p, i) => {
      const left = (p.x - minX) / (maxX - minX) * 100;
      const top  = 100 - (p.y - minY) / (maxY - minY) * 100;
      const size = 16 + Math.random()*14;
      const delay = TRUNK_TIME + i * (1500 / FLOWER_COUNT) + Math.random()*150;
      const rot = Math.floor(Math.random()*360);

      const el = document.createElement('div');
      el.className = 'flower';
      el.style.left = left + '%';
      el.style.top = top + '%';
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.animationDelay = delay + 'ms';
      el.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
      el.innerHTML = flowerSVG(hues[Math.floor(Math.random()*hues.length)]);
      el.addEventListener('click', () => {
        el.style.transition = 'transform .3s ease';
        el.style.transform = `translate(-50%,-50%) rotate(${rot}deg) scale(1.6)`;
        setTimeout(()=>{ el.style.transform = `translate(-50%,-50%) rotate(${rot}deg) scale(1)`; }, 300);
      });
      canopy.appendChild(el);
    });

    const totalTime = TRUNK_TIME + 1500 + 700;
    setTimeout(() => canopy.classList.add('sway'), totalTime);
    setTimeout(() => message.classList.add('show'), totalTime);
    startPetals(totalTime);
  }

  let petalInterval = null;
  function startPetals(after){
    clearInterval(petalInterval);
    setTimeout(() => {
      petalInterval = setInterval(() => {
        const petal = document.createElement('div');
        petal.className = 'falling-petal';
        petal.style.left = (10 + Math.random()*80) + '%';
        petal.style.animationDuration = (3 + Math.random()*2) + 's';
        petal.innerHTML = flowerSVG('#ffd54f');
        canopy.appendChild(petal);
        petal.addEventListener('animationend', () => petal.remove());
      }, 700);
    }, after);
  }

  function playAnimation(){
    clearInterval(petalInterval);
    clearCanopy();
    message.classList.remove('show');
    stage.classList.remove('grow');
    void stage.offsetWidth; // reflow para reiniciar animaciones CSS
    stage.classList.add('grow');
    plantFlowers();
  }

  document.getElementById('replay').addEventListener('click', playAnimation);

  window.addEventListener('load', playAnimation);
})();
</script>
</body>
</html>
