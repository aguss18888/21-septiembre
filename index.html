<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌻 Feliz Día de las Flores Amarillas 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <defs>
    <symbol id="sunflowerSymbol" viewBox="0 0 100 100"></symbol>
  </defs>
</svg>

<div class="layout" id="layout">

  <div class="message-panel" id="messagePanel">
    <div class="message-inner">
      <h1>🌻 Feliz Día de las Flores Amarillas 🌻</h1>
      <p class="to">Para mi Amor</p>
      <p>Cada girasol que ves aquí es un latido de mi corazón. Así como el sol ilumina los campos, tú iluminas mi vida. Que estas flores te recuerden lo especial que eres para mí.</p>
      <p class="love">¡TE AMO!</p>
      <p class="signature">Eres el sol que hace florecer cada uno de mis días.</p>
    </div>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="ground-line"></div>

      <div class="tree-box">
        <svg viewBox="0 0 100 140" preserveAspectRatio="xMidYMax meet">
          <path class="tree-trunk" id="treeTrunk"
            d="M44,140 L56,140 L52,60 L50,28 L48,60 Z"
            fill="var(--trunk)"/>
        </svg>
        <svg viewBox="0 0 100 140" preserveAspectRatio="xMidYMax meet">
          <path class="tree-branches" id="treeBranches"
            d="M46,92 L50,98 L18,45 Z
               M47,82 L51,86 L30,35 Z
               M49,86 L53,82 L70,32 Z
               M50,98 L54,92 L82,48 Z"
            fill="var(--trunk)"/>
        </svg>
      </div>

      <div class="canopy" id="canopy"></div>

      <div class="big-flower" id="bigFlower">
        <svg viewBox="0 0 100 100" width="100%" height="100%"><use href="#sunflowerSymbol"></use></svg>
      </div>

      <div class="click-hint" id="clickHint">
        <svg viewBox="0 0 40 14"><line x1="0" y1="7" x2="34" y2="7" stroke="#2b2b2b" stroke-width="1.5"/><polygon points="34,3 40,7 34,11" fill="#2b2b2b"/></svg>
        <span>Click Aquí</span>
      </div>
    </div>

    <div class="replay-wrap">
      <button id="replay">🌻 Ver de nuevo</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
