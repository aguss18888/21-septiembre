<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌻 Feliz Día de las Flores Amarillas 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f0e6;
  --trunk:#1f5c4c;
  --ink:#2b2b2b;
}
*{box-sizing:border-box;}
html,body{
  margin:0;
  min-height:100%;
  font-family:'Poppins',sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 12px;
}

.layout{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:8px;
  max-width:760px;
  width:100%;
}

/* ---- panel del mensaje (slide + fade-in) ---- */
.message-panel{
  flex:0 1 auto;
  max-width:0;
  max-height:0;
  opacity:0;
  overflow:hidden;
  transition:max-width 1.1s ease, max-height 1.1s ease, opacity .3s ease;
}
.message-panel.show{
  max-width:300px;
  max-height:600px;
  opacity:1;
  padding:6px 10px;
}
.message-inner{
  transform:translateX(-28px);
  opacity:0;
  transition:transform .9s ease .25s, opacity .9s ease .25s;
}
.message-panel.show .message-inner{
  transform:translateX(0);
  opacity:1;
}
.message-panel h1{
  font-family:'Pacifico',cursive;
  font-weight:400;
  font-size:1.35rem;
  color:#c77b00;
  margin:0 0 12px;
  line-height:1.4;
}
.message-panel p{
  font-size:.95rem;
  line-height:1.55;
  margin:0 0 10px;
}
.message-panel .to{
  font-family:'Pacifico',cursive;
  font-size:1.15rem;
  color:#d84343;
  margin:0 0 14px;
}
.message-panel .love{
  font-weight:700;
  color:#d84343;
  font-size:1.1rem;
}
.message-panel .signature{
  font-family:'Pacifico',cursive;
  font-size:1rem;
  color:#6b4423;
  margin-top:14px;
}

/* ---- escenario ---- */
.stage-wrap{ flex:0 0 auto; }
.stage{
  position:relative;
  width:min(78vw,300px);
  aspect-ratio:3/4;
  margin:0 auto;
}

.ground-line{
  position:absolute;
  left:-8%;
  right:-8%;
  bottom:8%;
  height:2px;
  background:var(--ink);
  opacity:.75;
}

/* girasol inicial clickeable */
.big-flower{
  position:absolute;
  left:50%;
  top:34%;
  width:34%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  cursor:pointer;
  animation:idlePulse 2.4s ease-in-out infinite;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));
  z-index:5;
}
@keyframes idlePulse{
  0%,100%{ transform:translate(-50%,-50%) scale(1); }
  50%{ transform:translate(-50%,-50%) scale(1.07); }
}
.big-flower.falling{
  animation:fallToGround .9s cubic-bezier(.55,.06,.85,.35) forwards;
}
@keyframes fallToGround{
  0%{ transform:translate(-50%,-50%) scale(1) rotate(0deg); opacity:1; }
  100%{ transform:translate(calc(-50% ),calc(-50% + var(--fall-distance,260px))) scale(.16) rotate(260deg); opacity:1; }
}
.big-flower.hidden{ display:none; }

.click-hint{
  position:absolute;
  left:64%;
  top:38%;
  display:flex;
  align-items:center;
  gap:6px;
  z-index:5;
  transition:opacity .3s ease;
}
.click-hint svg{ width:34px; height:14px; }
.click-hint span{
  font-size:.8rem;
  font-weight:600;
  border-bottom:1.5px solid var(--ink);
  padding-bottom:1px;
  white-space:nowrap;
}
.click-hint.fade-out{ opacity:0; }

/* arbol: tronco y ramas se revelan por separado, trazos verde bosque */
.tree-box{
  position:absolute;
  left:24%;
  right:24%;
  bottom:8%;
  height:56%;
}
.tree-box svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
}
.tree-trunk, .tree-branches{
  clip-path:inset(100% 0 0 0);
  transition:clip-path 1.1s cubic-bezier(.25,.8,.35,1);
}
.tree-trunk.grow, .tree-branches.grow{
  clip-path:inset(0 0 0 0);
}

/* corazon de girasoles */
.canopy{
  position:absolute;
  left:2%;
  right:2%;
  top:0;
  height:60%;
}
.canopy.sway{
  animation:sway 5s ease-in-out infinite;
  transform-origin:50% 100%;
}
@keyframes sway{
  0%,100%{ transform:rotate(-1deg); }
  50%{ transform:rotate(1deg); }
}

.flower{
  position:absolute;
  transform:translate(-50%,-50%) scale(0);
  opacity:0;
  animation:bloom .6s cubic-bezier(.34,1.56,.64,1) forwards;
  cursor:default;
}
@keyframes bloom{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(0) rotate(-30deg); }
  65%{ opacity:1; transform:translate(-50%,-50%) scale(1.15) rotate(6deg); }
  100%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
}
.flower.windaway{
  animation:windAway 1.3s ease-in forwards !important;
}
@keyframes windAway{
  0%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
  100%{ opacity:0; transform:translate(calc(-50% + var(--wx)),calc(-50% + var(--wy))) scale(.55) rotate(var(--wrot)); }
}

.falling-petal{
  position:absolute;
  width:13px;
  height:13px;
  top:-10px;
  opacity:.85;
  pointer-events:none;
  animation:fall linear forwards;
}
@keyframes fall{
  0%{ transform:translateY(0) rotate(0deg); opacity:.85; }
  100%{ transform:translateY(300px) rotate(280deg); opacity:0; }
}

button#replay{
  margin-top:10px;
  padding:8px 18px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#ffd54f,#ffb300);
  color:#5c3c00;
  font-family:'Poppins',sans-serif;
  font-weight:600;
  font-size:.82rem;
  cursor:pointer;
  opacity:.85;
  box-shadow:0 4px 14px rgba(255,179,0,.35);
  transition:opacity .2s ease;
}
button#replay:hover{ opacity:1; }
.replay-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  margin-top:8px;
}
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <defs>
    <symbol id="sunflowerSymbol" viewBox="0 0 100 100"></symbol>
  </defs>
</svg>

<div class="layout" id="layout">

  <div class="message-panel" id="messagePanel">
    <div class="message-inner">
      <h1>🌻 Feliz Día de las Flores Amarillas 🌻</h1>
      <p class="to">Para mi Amor</p>
      <p>Cada girasol que ves aquí es un latido de mi corazón. Así como el sol ilumina los campos, tú iluminas mi vida. Que estas flores te recuerden lo especial que eres para mí.</p>
      <p class="love">¡TE AMO!</p>
      <p class="signature">Eres el sol que hace florecer cada uno de mis días.</p>
    </div>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="ground-line"></div>

      <div class="tree-box">
        <svg viewBox="0 0 100 140" preserveAspectRatio="xMidYMax meet">
          <path class="tree-trunk" id="treeTrunk"
            d="M44,140 L56,140 L52,60 L50,28 L48,60 Z"
            fill="var(--trunk)"/>
        </svg>
        <svg viewBox="0 0 100 140" preserveAspectRatio="xMidYMax meet">
          <path class="tree-branches" id="treeBranches"
            d="M46,92 L50,98 L18,45 Z
               M47,82 L51,86 L30,35 Z
               M49,86 L53,82 L70,32 Z
               M50,98 L54,92 L82,48 Z"
            fill="var(--trunk)"/>
        </svg>
      </div>

      <div class="canopy" id="canopy"></div>

      <div class="big-flower" id="bigFlower">
        <svg viewBox="0 0 100 100" width="100%" height="100%"><use href="#sunflowerSymbol"></use></svg>
      </div>

      <div class="click-hint" id="clickHint">
        <svg viewBox="0 0 40 14"><line x1="0" y1="7" x2="34" y2="7" stroke="#2b2b2b" stroke-width="1.5"/><polygon points="34,3 40,7 34,11" fill="#2b2b2b"/></svg>
        <span>Click Aquí</span>
      </div>
    </div>

    <div class="replay-wrap">
      <button id="replay">🌻 Ver de nuevo</button>
    </div>
  </div>

</div>

<script>
(function(){
  // ---------- construir el simbolo del girasol reutilizable ----------
  function petalPath(rOuter, rInner){
    return `M50,50 Q44,${(50-rInner).toFixed(1)} 50,${(50-rOuter).toFixed(1)} Q56,${(50-rInner).toFixed(1)} 50,50 Z`;
  }
  function buildPetals(count, rOuter, rInner, color, angleOffset){
    let s = '';
    for(let i=0;i<count;i++){
      const a = (360/count)*i + angleOffset;
      s += `<path d="${petalPath(rOuter,rInner)}" fill="${color}" stroke="#d98c00" stroke-width="0.5" transform="rotate(${a} 50 50)"/>`;
    }
    return s;
  }
  function buildCenterDots(count, maxR){
    let s = '';
    const golden = 137.508 * Math.PI/180;
    for(let i=0;i<count;i++){
      const r = maxR * Math.sqrt(i/count);
      const a = i*golden;
      const x = 50 + r*Math.cos(a);
      const y = 50 + r*Math.sin(a);
      const c = (i%2===0) ? '#6b4423' : '#2e1a0d';
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.6" fill="${c}"/>`;
    }
    return s;
  }
  const sunflowerMarkup =
    buildPetals(14,48,24,'#ffb300',0) +
    buildPetals(14,35,18,'#ffca28',12.857) +
    `<circle cx="50" cy="50" r="22" fill="#3e2415" stroke="#2a170c" stroke-width="1"/>` +
    buildCenterDots(46,19);
  document.getElementById('sunflowerSymbol').innerHTML = sunflowerMarkup;

  // ---------- referencias ----------
  const stage = document.getElementById('stage');
  const bigFlower = document.getElementById('bigFlower');
  const clickHint = document.getElementById('clickHint');
  const groundLine = stage.querySelector('.ground-line');
  const treeTrunk = document.getElementById('treeTrunk');
  const treeBranches = document.getElementById('treeBranches');
  const canopy = document.getElementById('canopy');
  const messagePanel = document.getElementById('messagePanel');

  const FLOWER_COUNT = 190; // 180-200 girasoles formando el corazon
  let petalInterval = null;
  let flowerEls = [];

  // Ecuacion parametrica clasica del corazon:
  // x = 16 sin^3(t) ; y = 13 cos(t) - 5 cos(2t) - 2 cos(3t) - cos(4t)
  function heartPoint(t, r){
    const x = r * 16 * Math.pow(Math.sin(t), 3);
    const y = r * (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    return {x, y, r};
  }
  function buildHeartPoints(n){
    const pts = [];
    for(let i=0;i<n;i++){
      const t = Math.random() * Math.PI * 2;
      const r = Math.pow(Math.random(), 0.45); // mas densidad hacia el borde
      pts.push(heartPoint(t, r));
    }
    // de adentro hacia afuera: orden ascendente por radio
    pts.sort((a,b)=> a.r - b.r);
    return pts;
  }

  function sunflowerHTML(){
    return `<svg viewBox="0 0 100 100" width="100%" height="100%"><use href="#sunflowerSymbol"></use></svg>`;
  }

  // ---------- paso 1: click en el girasol ----------
  function onFlowerClick(){
    bigFlower.removeEventListener('click', onFlowerClick);
    clickHint.classList.add('fade-out');

    const flowerRect = bigFlower.getBoundingClientRect();
    const groundRect = groundLine.getBoundingClientRect();
    const fallDistance = groundRect.top - flowerRect.top - flowerRect.height*0.1;
    bigFlower.style.setProperty('--fall-distance', fallDistance + 'px');
    bigFlower.classList.add('falling');

    bigFlower.addEventListener('animationend', function handler(){
      bigFlower.removeEventListener('animationend', handler);
      bigFlower.classList.add('hidden');
      growTrunk();
    });
  }

  // ---------- paso 2: nace el tronco ----------
  function growTrunk(){
    void treeTrunk.getBoundingClientRect();
    treeTrunk.classList.add('grow');
    treeTrunk.addEventListener('transitionend', function handler(){
      treeTrunk.removeEventListener('transitionend', handler);
      growBranches();
    });
  }

  // ---------- paso 3: crecen las ramas ----------
  function growBranches(){
    void treeBranches.getBoundingClientRect();
    treeBranches.classList.add('grow');
    treeBranches.addEventListener('transitionend', function handler(){
      treeBranches.removeEventListener('transitionend', handler);
      bloomHeart();
    });
  }

  // ---------- paso 4: florece el corazon (de adentro hacia afuera, pop/bloom) ----------
  function bloomHeart(){
    const pts = buildHeartPoints(FLOWER_COUNT);
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    pts.forEach(p=>{
      if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
      if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
    });

    flowerEls = [];
    pts.forEach((p,i)=>{
      const left = (p.x - minX)/(maxX-minX)*100;
      const top  = 100 - (p.y - minY)/(maxY-minY)*100;
      const size = 14 + Math.random()*12;
      const delay = i * (1600/FLOWER_COUNT) + Math.random()*80;

      const el = document.createElement('div');
      el.className = 'flower';
      el.style.left = left+'%';
      el.style.top = top+'%';
      el.style.width = size+'px';
      el.style.height = size+'px';
      el.style.animationDelay = delay+'ms';
      el.innerHTML = sunflowerHTML();
      canopy.appendChild(el);
      flowerEls.push(el);
    });

    const totalTime = 1600 + 700;
    setTimeout(()=> canopy.classList.add('sway'), totalTime);
    setTimeout(windEffect, totalTime);
  }

  // ---------- paso 5: viento hacia los lados + lluvia de petalos + carta ----------
  function windEffect(){
    const shuffled = flowerEls.slice().sort(()=>Math.random()-0.5);
    const toBlow = shuffled.slice(0, Math.floor(shuffled.length*0.20));

    toBlow.forEach((el,i)=>{
      const side = Math.random() < 0.5 ? -1 : 1; // vuelan hacia la izquierda o la derecha
      const wx = side * (140 + Math.random()*160);
      const wy = -(20 + Math.random()*70);
      const wrot = (Math.random()*260-130) + 'deg';
      el.style.setProperty('--wx', wx+'px');
      el.style.setProperty('--wy', wy+'px');
      el.style.setProperty('--wrot', wrot);
      el.style.animationDelay = (Math.random()*600)+'ms';
      setTimeout(()=> el.classList.add('windaway'), i*20);
    });

    setTimeout(()=>{
      messagePanel.classList.add('show');
    }, 350);

    setTimeout(startAmbientPetals, 800);
  }

  // lluvia constante y lenta de petalos, se mantiene indefinidamente
  function startAmbientPetals(){
    clearInterval(petalInterval);
    petalInterval = setInterval(()=>{
      const petal = document.createElement('div');
      petal.className = 'falling-petal';
      petal.style.left = (10+Math.random()*80)+'%';
      petal.style.animationDuration = (4+Math.random()*2.5)+'s';
      petal.innerHTML = sunflowerHTML();
      canopy.appendChild(petal);
      petal.addEventListener('animationend', ()=> petal.remove());
    }, 1600);
  }

  // ---------- boton "ver de nuevo": reinicia todo desde cero ----------
  function resetAll(){
    clearInterval(petalInterval);
    canopy.innerHTML = '';
    canopy.classList.remove('sway');
    flowerEls = [];

    messagePanel.classList.remove('show');

    treeTrunk.classList.remove('grow');
    treeBranches.classList.remove('grow');

    bigFlower.classList.remove('falling','hidden');
    bigFlower.style.removeProperty('--fall-distance');
    void bigFlower.offsetWidth;
    clickHint.classList.remove('fade-out');

    bigFlower.addEventListener('click', onFlowerClick);
  }

  document.getElementById('replay').addEventListener('click', resetAll);
  bigFlower.addEventListener('click', onFlowerClick);
})();
</script>
</body>
</html>
