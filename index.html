<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌻 Feliz Día de las Flores Amarillas 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f0e6;
    --ink:#3b2a18;
    --green:#1f5c4c;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:16px;
  }

  .container{
    position:relative;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    width:100%;
    max-width:1100px;
    gap:0;
  }

  /* ---- carta lateral: arranca en cero (escena centrada en el arbol) y se
         abre recien cuando florece, empujando el arbol hacia el lado,
         igual que el cambio de escenario del video ---- */
  .card{
    flex:0 0 auto;
    width:0;
    opacity:0;
    overflow:hidden;
    margin-right:0;
    transition:width 1.15s cubic-bezier(.16,1,.3,1), margin-right 1.15s cubic-bezier(.16,1,.3,1), opacity .9s ease .2s;
    pointer-events:none;
  }
  .card.show{
    width:min(380px,42vw);
    margin-right:32px;
    opacity:1;
    pointer-events:auto;
  }
  /* ancho fijo interno: el texto nunca se reajusta, solo se revela */
  .card-inner{ width:min(380px,42vw); }
  .card h1{
    font-family:'EB Garamond', serif;
    font-variant:small-caps;
    font-weight:600;
    color:var(--ink);
    font-size:1.5rem;
    letter-spacing:.3px;
    margin-bottom:6px;
    line-height:1.35;
  }
  .card .to{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:1.8rem;
    color:var(--ink);
    margin-bottom:14px;
    line-height:1;
  }
  .card p{
    font-family:'EB Garamond', serif;
    font-variant:small-caps;
    font-weight:500;
    font-size:1.15rem;
    line-height:1.5;
    color:var(--ink);
    margin-bottom:0;
  }
  .card .signature{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:1.45rem;
    color:var(--ink);
    margin-top:16px;
  }

  /* ---- linea de suelo compartida entre la carta y el arbol ---- */
  .shared-ground{
    position:absolute;
    left:0;
    height:1.5px;
    background:var(--ink);
    opacity:.7;
    pointer-events:none;
  }

  /* ---- escenario canvas ---- */
  .stage-wrap{ flex:1 1 320px; display:flex; flex-direction:column; align-items:center; }
  .canvas-wrapper{
    position:relative;
    width:100%;
    max-width:420px;
  }
  canvas{
    display:block;
    width:100%;
    height:auto;
    cursor:pointer;
  }
  .hint{
    position:absolute;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:.85rem;
    font-weight:500;
    color:var(--ink);
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .hint.fade-out{ opacity:0; }

  button#replay{
    margin-top:6px;
    padding:8px 18px;
    border:none;
    border-radius:999px;
    background:linear-gradient(135deg,#ffd54f,#ffb300);
    color:#5c3c00;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:.82rem;
    cursor:pointer;
    opacity:.8;
    box-shadow:0 4px 14px rgba(255,179,0,.35);
    transition:opacity .2s ease;
  }
  button#replay:hover{ opacity:1; }

  @media (max-width:760px){
    .container{ flex-direction:column-reverse; }
    .card{ width:100%; max-height:0; margin-right:0; opacity:0; overflow:hidden; transition:max-height 1.1s ease, opacity .9s ease .2s; }
    .card.show{ width:100%; max-height:600px; opacity:1; }
    .card-inner{ width:100%; max-width:420px; margin:0 auto; text-align:center; }
    .shared-ground{ display:none; }
  }
</style>
</head>
<body>

<div class="container" id="container">
  <div class="card" id="card">
    <div class="card-inner">
      <h1>🌻 Feliz Día de las Flores Amarillas 🌻</h1>
      <div class="to">Para mi Amor</div>
      <p>Cada girasol que ves aquí es un latido de mi corazón. Así como el sol ilumina los campos, tú iluminas mi vida. Que estas flores te recuerden lo especial que eres para mí. - ¡Te Amo!</p>
      <p class="signature">Eres el sol que hace florecer cada uno de mis días.</p>
    </div>
  </div>

  <div class="stage-wrap">
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="treeCanvas" width="600" height="700"></canvas>
      <div class="hint" id="hint" style="left:68%; top:26%;">
        <svg width="30" height="12" viewBox="0 0 30 12"><line x1="0" y1="6" x2="24" y2="6" stroke="#3b2a18" stroke-width="1.5"/><polygon points="24,2 30,6 24,10" fill="#3b2a18"/></svg>
        <span>Click Aquí</span>
      </div>
    </div>
    <button id="replay">🌻 Ver de nuevo</button>
  </div>

  <div class="shared-ground" id="sharedGround"></div>
</div>

<script>
(function(){
  const canvas = document.getElementById('treeCanvas');
  const ctx = canvas.getContext('2d');
  const card = document.getElementById('card');
  const hint = document.getElementById('hint');
  const container = document.getElementById('container');
  const sharedGround = document.getElementById('sharedGround');
  const W = canvas.width, H = canvas.height;

  const groundY = 640;
  const trunkBase = { x: 300, y: groundY };
  const trunkTip  = { x: 300, y: 355 };
  // el corazon queda metido dentro de las ramas, no flotando encima
  const heartCenterX = 300, heartCenterY = 163, heartScale = 11.6;

  function lerp(a,b,t){ return a + (b-a)*t; }
  function lerpPoint(a,b,t){ return { x: lerp(a.x,b.x,t), y: lerp(a.y,b.y,t) }; }
  function easeOutBack(t){
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // ---------- sprite de girasol pre-renderizado (rendimiento) ----------
  function makeSunflowerSprite(){
    const size = 128, cx = size/2, cy = size/2;
    const off = document.createElement('canvas');
    off.width = size; off.height = size;
    const c = off.getContext('2d');

    function petal(rOuter, rInner, color){
      c.beginPath();
      c.moveTo(cx, cy);
      c.quadraticCurveTo(cx-6, cy-rInner, cx, cy-rOuter);
      c.quadraticCurveTo(cx+6, cy-rInner, cx, cy);
      c.closePath();
      c.fillStyle = color;
      c.strokeStyle = '#d98c00';
      c.lineWidth = 0.6;
      c.fill();
      c.stroke();
    }
    function petalLayer(count, rOuter, rInner, color, offsetDeg){
      for(let i=0;i<count;i++){
        c.save();
        c.translate(cx,cy);
        c.rotate((Math.PI*2/count)*i + offsetDeg*Math.PI/180);
        c.translate(-cx,-cy);
        petal(rOuter, rInner, color);
        c.restore();
      }
    }
    petalLayer(14, 60, 30, '#ffb300', 0);
    petalLayer(14, 44, 22, '#ffca28', 12.857);

    c.beginPath();
    c.arc(cx, cy, 27, 0, Math.PI*2);
    c.fillStyle = '#3e2415';
    c.strokeStyle = '#2a170c';
    c.lineWidth = 1;
    c.fill(); c.stroke();

    const golden = 137.508 * Math.PI/180;
    for(let i=0;i<46;i++){
      const r = 23 * Math.sqrt(i/46);
      const a = i*golden;
      c.beginPath();
      c.arc(cx + r*Math.cos(a), cy + r*Math.sin(a), 1.9, 0, Math.PI*2);
      c.fillStyle = (i%2===0) ? '#6b4423' : '#2e1a0d';
      c.fill();
    }
    return off;
  }
  const sunflowerSprite = makeSunflowerSprite();

  function drawSunflower(x, y, radius, scale, rotation, alpha){
    if(scale<=0 || alpha<=0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(rotation);
    const d = radius*2*scale;
    ctx.drawImage(sunflowerSprite, -d/2, -d/2, d, d);
    ctx.restore();
  }

  // ---------- suelo dentro del canvas ----------
  function drawGround(){
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(600, groundY);
    ctx.strokeStyle = '#3b2a18';
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---------- arbol: tronco + ramas como formas rellenas que "crecen" ----------
  function drawTaperedBranch(base, tip, baseW, tipW, t){
    if(t<=0) return;
    const tt = Math.min(t,1);
    const cur = lerpPoint(base, tip, tt);
    const curW = lerp(baseW, tipW, tt);
    const dx = cur.x-base.x, dy = cur.y-base.y;
    const len = Math.hypot(dx,dy)||1;
    const nx = -dy/len, ny = dx/len;
    ctx.beginPath();
    ctx.moveTo(base.x+nx*baseW/2, base.y+ny*baseW/2);
    ctx.lineTo(cur.x+nx*curW/2, cur.y+ny*curW/2);
    ctx.lineTo(cur.x-nx*curW/2, cur.y-ny*curW/2);
    ctx.lineTo(base.x-nx*baseW/2, base.y-ny*baseW/2);
    ctx.closePath();
    ctx.fill();
  }

  // ramas mas numerosas y altas para que llenen todo el interior del corazon,
  // igual que en el video: no debe quedar un hueco entre el arbol y las flores
  const branches = [
    { baseF:0.50, tip:{x:145,y:410}, baseW:9,  tipW:1.5 },
    { baseF:0.62, tip:{x:180,y:340}, baseW:7.5,tipW:1.3 },
    { baseF:0.74, tip:{x:225,y:255}, baseW:6.5,tipW:1.2 },
    { baseF:1.00, tip:{x:300,y:195}, baseW:7,  tipW:1.2 }, // pua central, sigue el tronco
    { baseF:0.74, tip:{x:378,y:255}, baseW:6.5,tipW:1.2 },
    { baseF:0.62, tip:{x:422,y:340}, baseW:7.5,tipW:1.3 },
    { baseF:0.50, tip:{x:458,y:410}, baseW:9,  tipW:1.5 },
  ];

  function drawTree(trunkT, branchTs){
    ctx.fillStyle = '#1f5c4c';
    drawTaperedBranch(trunkBase, trunkTip, 24, 9, trunkT);
    branches.forEach((b,i)=>{
      const base = lerpPoint(trunkBase, trunkTip, b.baseF);
      drawTaperedBranch(base, b.tip, b.baseW, b.tipW, branchTs[i]);
    });
  }

  // ---------- corazon de girasoles (ecuacion parametrica), metido en el arbol ----------
  function heartXY(t, r){
    const x = 16 * Math.pow(Math.sin(t), 3) * r;
    const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * r;
    return { x, y, r };
  }

  let flowerPts = [];

  // relleno en anillos concentricos (no al azar) para que no quede
  // ningun hueco sin flor: cada anillo lleva puntos proporcionales a su
  // radio, y el tamano de cada flor se solapa con sus vecinas.
  function buildHeart(){
    const raw = [];
    const rings = [0.12, 0.22, 0.32, 0.42, 0.52, 0.62, 0.72, 0.82, 0.91, 1.0];
    rings.forEach((r, ringIdx)=>{
      const count = Math.max(8, Math.round(54 * r));
      for(let i=0;i<count;i++){
        const t = (i/count) * Math.PI*2 + (ringIdx%2===0 ? 0 : (Math.PI/count));
        const jitterT = (Math.random()-0.5) * (Math.PI/count) * 0.5;
        const jitterR = 1 + (Math.random()-0.5)*0.05;
        raw.push(heartXY(t + jitterT, Math.min(r*jitterR, 1)));
      }
    });
    raw.sort((a,b)=> a.r - b.r); // de adentro hacia afuera

    const bloomSpan = 2100;
    flowerPts = raw.map((p,i)=>({
      baseX: heartCenterX + p.x*heartScale,
      baseY: heartCenterY + p.y*heartScale,
      size: 22 + Math.random()*8,
      rotation: Math.random()*Math.PI*2,
      appearAt: i*(bloomSpan/raw.length) + Math.random()*80,
      scale: 0,
      alpha: 1,
      blown: false,
      vx: 0, vy: 0,
    }));
  }
  buildHeart();

  // ---------- petalos ambiente (lluvia lenta y constante) ----------
  let petals = [];
  let petalTimer = 900;
  function spawnPetal(){
    petals.push({
      x: 120 + Math.random()*360,
      y: -20,
      size: 9 + Math.random()*6,
      vy: 26 + Math.random()*18,
      rotation: Math.random()*Math.PI*2,
      rotSpeed: (Math.random()-0.5)*1.2,
      alpha: 0.85,
    });
  }

  // ---------- estado de la flor inicial ----------
  const initialFlower = { x: 300, y: 210, radius: 34, vy: 0 };

  // ---------- maquina de estados ----------
  let state = 'WAITING'; // WAITING, FALLING, GROWING, BLOOMING, WIND, DONE
  let growElapsed = 0;
  let bloomElapsed = 0;
  let swayElapsed = 0;
  let lastTime = null;

  const TRUNK_MS = 900, BRANCH_MS = 600, BRANCH_STAGGER = 110;

  function totalGrowMs(){
    return TRUNK_MS + BRANCH_STAGGER*(branches.length-1) + BRANCH_MS;
  }

  function triggerWind(){
    const shuffled = flowerPts.slice().sort(()=>Math.random()-0.5);
    const toBlow = shuffled.slice(0, Math.floor(shuffled.length*0.2));
    toBlow.forEach(f=>{
      const side = Math.random()<0.5 ? -1 : 1;
      f.blown = true;
      f.vx = side * (60 + Math.random()*70);
      f.vy = -(30 + Math.random()*50);
    });
    setTimeout(()=> card.classList.add('show'), 300);
  }

  function update(dt){
    if(state === 'FALLING'){
      initialFlower.vy += 620*dt;
      initialFlower.y += initialFlower.vy*dt;
      if(initialFlower.y >= groundY - 6){
        initialFlower.y = groundY - 6;
        state = 'GROWING';
        growElapsed = 0;
      }
    }
    else if(state === 'GROWING'){
      growElapsed += dt*1000;
      if(growElapsed >= totalGrowMs()){
        state = 'BLOOMING';
        bloomElapsed = 0;
      }
    }
    else if(state === 'BLOOMING'){
      bloomElapsed += dt*1000;
      let allDone = true;
      flowerPts.forEach(f=>{
        const local = bloomElapsed - f.appearAt;
        if(local <= 0){ allDone = false; return; }
        const dur = 480;
        const tt = Math.min(local/dur, 1);
        f.scale = easeOutBack(tt);
        if(tt < 1) allDone = false;
      });
      if(allDone){
        state = 'WIND';
        setTimeout(triggerWind, 150);
      }
    }
    else if(state === 'WIND' || state === 'DONE'){
      swayElapsed += dt;
      flowerPts.forEach(f=>{
        if(f.blown){
          f.baseX += f.vx*dt;
          f.baseY += f.vy*dt;
          f.vy += 40*dt;
          f.alpha -= dt*0.8;
        }
      });
      flowerPts = flowerPts.filter(f=> !(f.blown && f.alpha<=0));
      if(state === 'WIND') state = 'DONE';
    }

    if(state === 'GROWING' || state === 'BLOOMING' || state === 'WIND' || state === 'DONE'){
      petalTimer -= dt*1000;
      if(petalTimer <= 0){
        spawnPetal();
        petalTimer = 1300 + Math.random()*900;
      }
    }
    petals.forEach(p=>{
      p.y += p.vy*dt;
      p.rotation += p.rotSpeed*dt;
    });
    petals = petals.filter(p=> p.y < H+30);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    drawGround();

    if(state === 'WAITING' || state === 'FALLING'){
      drawSunflower(initialFlower.x, initialFlower.y, initialFlower.radius, 1, 0, 1);
    }

    if(state === 'GROWING' || state === 'BLOOMING' || state === 'WIND' || state === 'DONE'){
      const trunkT = Math.min(growElapsed/TRUNK_MS, 1);
      if(state === 'GROWING'){
        const branchTs = branches.map((b,i)=>{
          const start = TRUNK_MS + i*BRANCH_STAGGER;
          return Math.max(0, Math.min((growElapsed-start)/BRANCH_MS, 1));
        });
        drawTree(trunkT, branchTs);
      } else {
        // una vez florece, las ramas quedan tapadas por las flores (solo tronco visible)
        drawTree(1, branches.map(()=>0));
      }
    }

    if(state === 'BLOOMING' || state === 'WIND' || state === 'DONE'){
      const sway = (state==='WIND'||state==='DONE') ? Math.sin(swayElapsed*0.7)*0.035 : 0;
      const pivot = trunkTip;
      flowerPts.forEach(f=>{
        let x = f.baseX, y = f.baseY;
        if(sway !== 0){
          const dx = x-pivot.x, dy=y-pivot.y;
          x = pivot.x + dx*Math.cos(sway) - dy*Math.sin(sway);
          y = pivot.y + dx*Math.sin(sway) + dy*Math.cos(sway);
        }
        drawSunflower(x, y, f.size, f.scale, f.rotation, f.alpha);
      });
    }

    petals.forEach(p=>{
      drawSunflower(p.x, p.y, p.size, 1, p.rotation, p.alpha);
    });
  }

  function loop(ts){
    if(lastTime===null) lastTime = ts;
    const dt = Math.min((ts-lastTime)/1000, 0.05);
    lastTime = ts;
    update(dt);
    draw();
    positionSharedGround();
    requestAnimationFrame(loop);
  }

  // ---------- linea de suelo compartida entre la carta y el arbol ----------
  function positionSharedGround(){
    const canvasRect = canvas.getBoundingClientRect();
    const containerRect = container.getBoundingClientRect();
    if(canvasRect.width === 0) return;
    const groundScreenY = canvasRect.top + (groundY/H)*canvasRect.height;
    sharedGround.style.top = (groundScreenY - containerRect.top) + 'px';
    sharedGround.style.width = (canvasRect.left - containerRect.left + 4) + 'px';
  }

  // ---------- interaccion ----------
  function handleClick(e){
    if(state !== 'WAITING') return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clickX = (e.clientX - rect.left) * scaleX;
    const clickY = (e.clientY - rect.top) * scaleY;
    const dist = Math.hypot(clickX - initialFlower.x, clickY - initialFlower.y);
    if(dist < initialFlower.radius * 1.6){
      state = 'FALLING';
      hint.classList.add('fade-out');
    }
  }
  canvas.addEventListener('click', handleClick);

  function resetAll(){
    state = 'WAITING';
    initialFlower.x = 300; initialFlower.y = 210; initialFlower.vy = 0;
    growElapsed = 0; bloomElapsed = 0; swayElapsed = 0;
    petals = []; petalTimer = 900;
    buildHeart();
    card.classList.remove('show');
    hint.classList.remove('fade-out');
  }
  document.getElementById('replay').addEventListener('click', resetAll);

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
